[project]
name = "vpn-cabinet"
version = "0.1.0"
description = "Web personal cabinet for a VPN service: email-first login with optional Telegram linking"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "jinja2>=3.1",
    "httpx>=0.27",
    # FastAPI разбирает формы (`POST /login` с полями почты и кода) только
    # через python-multipart. Без него эндпоинт отвечает ошибкой, а не
    # отказом, — и это выяснилось на чистом раннере: локально пакет был в
    # окружении случайно, в зависимостях его не было.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cabinet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Все тесты идут против моков. Живой бэкенд подключается на волне W6, и до этого
# момента ни один тест не должен ходить в сеть или в базу: иначе зелёный прогон
# на машине разработчика перестаёт что-либо значить на чистом раннере.
addopts = "-q --strict-markers"
asyncio_mode = "auto"
markers = [
    "live: требует живого бэкенда; по умолчанию НЕ запускается",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
